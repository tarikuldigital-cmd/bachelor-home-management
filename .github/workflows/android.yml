name: Build Android app (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install & build web app
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Create Android project
        working-directory: client
        run: |
          npx cap add android
          npx cap sync android
          # app icons
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/icons/android-$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp public/icons/android-$d.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../BachelorHome.apk

      - name: Publish to GitHub Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest BachelorHome.apk \
            --title "Bachelor Home — Android app" \
            --notes "Download BachelorHome.apk and install it on your Android phone (allow 'Install unknown apps'). Built from ${GITHUB_SHA::7}." \
            --latest
